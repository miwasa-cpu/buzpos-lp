name: Validate HTML

# 本番は Vercel（/api/contact が Vercel の関数として動く）。
# Cloudflare Pages には api/contact.js が関数として載らず、pages.dev から送るとフォームが 404/405 になるため、
# main への push・PR での `pages deploy .` はやめた（deploy / lighthouse ジョブを削除）。
# buzpos-lp.pages.dev は .github/workflows/pages-redirect.yml（手動実行）で本番ドメインへの 301 に差し替える。

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    name: HTML Validate
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install html-validate
        run: npm install -g html-validate

      - name: Validate HTML
        run: html-validate index.html || true

  compress-images:
    runs-on: ubuntu-latest
    name: Compress Images
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install imagemin
        run: npm install -g imagemin-cli imagemin-mozjpeg imagemin-pngquant

      - name: Compress images
        run: |
          for f in *.jpg *.jpeg *.png; do
            [ -f "$f" ] || continue
            original=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")
            imagemin "$f" --plugin=mozjpeg --plugin=pngquant --out-dir=. 2>/dev/null || true
            compressed=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")
            echo "$f: ${original} → ${compressed} bytes"
          done
