<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>BUZPOS株式会社</title>

<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { display: grid; place-items: center; padding: 24px; font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif; color: #0f1d2f; background: #f6f9fb; }
  main { width: 100%; max-width: 520px; text-align: center; }
  img { width: 160px; height: auto; margin: 0 auto 28px; }
  h1 { font-size: 20px; font-weight: 700; line-height: 1.5; }
  p { margin-top: 12px; font-size: 14px; line-height: 1.9; color: #4a5568; }
  a.btn { display: inline-block; margin-top: 24px; padding: 14px 28px; border-radius: 999px; background: #06c755; color: #fff; font-weight: 700; text-decoration: none; }
  a.site { display: inline-block; margin-top: 16px; font-size: 13px; color: #0091d6; }
</style>
</head>
<body>
<main>
  <img src="buzpos_logo.png" width="160" height="56" alt="BUZPOS">
  <h1>サービスページは現在準備中です</h1>
  <p>お問い合わせは LINE で受け付けています。</p>
  <a class="btn" href="https://lin.ee/aN0JGeo" target="_blank" rel="noopener">LINEで問い合わせる</a><br>
  <a class="site" href="https://buzpos.co.jp" target="_blank" rel="noopener">buzpos.co.jp</a>
</main>
</body>
</html>
